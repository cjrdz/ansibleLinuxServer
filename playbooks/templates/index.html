<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inicio | {{ inventory_hostname }}</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🏠</text></svg>"
        />
        <style>
            body {
                display: grid;
                place-items: center;
                min-height: 100vh;
            }

            main {
                max-width: 500px;
                width: 90%;
            }

            .status {
                color: #27ae60;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Bienvenido a {{ inventory_hostname }}</h1>

            <article>
                <h2>Estado del Servidor</h2>
                <ul>
                    <li>
                        <strong>Estado:</strong>
                        <span class="status">✓ En Ejecución</span>
                    </li>
                    <li><strong>Servidor Web:</strong> Nginx</li>
                    <li><strong>Sistema Operativo:</strong> Ubuntu</li>
                    <li>
                        <strong>Desplegado:</strong> {{
                        ansible_facts["date_time"]["iso8601"] }}
                    </li>
                </ul>
            </article>

            <footer>
                <small>Desplegado vía Ansible</small>
            </footer>
        </main>
    </body>
</html>
