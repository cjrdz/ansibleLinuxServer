---
# ============================================================================
# INSTALAR NGINX EN SERVIDORES UBUNTU Y CREAR index.nginx-debian.html
# ============================================================================

- name: Instalar y Configurar Nginx con Página de Índice Personalizada
  hosts: ubuntu_servers
  become: true

  vars:
    # Nombre del paquete y servicio de Nginx
    nginx_package: nginx
    nginx_service: nginx
    nginx_root: /var/www/html
    index_file: index.nginx-debian.html
    node_name: "Node1"

  tasks:
    # ------------------------------------------------------------------------
    # PASO 1: Actualizar Caché de Paquetes
    # ------------------------------------------------------------------------
    - name: Actualizar caché de paquetes apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: cache_update

    - name: Mostrar resultado de actualización de caché
      ansible.builtin.debug:
        msg: "Caché de paquetes actualizada en {{ inventory_hostname }}"
      when: cache_update is succeeded

    # ------------------------------------------------------------------------
    # PASO 2: Instalar Servidor Web Nginx
    # ------------------------------------------------------------------------
    - name: Instalar servidor web Nginx
      ansible.builtin.apt:
        name: "{{ nginx_package }}"
        state: present
        update_cache: no
      register: nginx_install
      tags: install

    - name: Mostrar resultado de instalación de Nginx
      ansible.builtin.debug:
        msg: "Nginx instalado exitosamente en {{ inventory_hostname }}"
      when: nginx_install is succeeded

    # ------------------------------------------------------------------------
    # PASO 3: Asegurar que el Servicio Nginx Esté Iniciado y Habilitado
    # ------------------------------------------------------------------------
    - name: Iniciar servicio Nginx
      ansible.builtin.service:
        name: "{{ nginx_service }}"
        state: started
        enabled: true
      register: nginx_started
      tags: service

    - name: Mostrar estado del servicio Nginx
      ansible.builtin.debug:
        msg: "Servicio Nginx iniciado y habilitado en {{ inventory_hostname }}"
      when: nginx_started is succeeded

    # ------------------------------------------------------------------------
    # PASO 4: Desplegar index.nginx-debian.html Personalizado desde Plantilla
    # ------------------------------------------------------------------------
    # Esto despliega una página de bienvenida desde un archivo de plantilla separado para facilitar la edición
    - name: Desplegar index.nginx-debian.html desde plantilla
      ansible.builtin.template:
        src: index.html
        dest: "{{ nginx_root }}/{{ index_file }}"
        owner: root
        group: root
        mode: "0644"
      register: index_created
      tags: configure

    - name: Mostrar resultado de creación de página de índice
      ansible.builtin.debug:
        msg: "index.nginx-debian.html personalizado creado en {{ inventory_hostname }}"
      when: index_created is succeeded

    # ------------------------------------------------------------------------
    # PASO 5: Verificar Configuración de Nginx
    # ------------------------------------------------------------------------
    - name: Probar sintaxis de configuración de Nginx
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false
      tags: validate

    - name: Mostrar resultado de prueba de configuración de Nginx
      ansible.builtin.debug:
        msg: "Configuración de Nginx es válida en {{ inventory_hostname }}"
      when: nginx_test is succeeded

    # ------------------------------------------------------------------------
    # PASO 6: Recargar Nginx para Aplicar Cambios
    # ------------------------------------------------------------------------
    - name: Recargar servicio Nginx para aplicar cambios
      ansible.builtin.service:
        name: "{{ nginx_service }}"
        state: reloaded
      register: nginx_reloaded
      tags: service

    - name: Mostrar resultado de recarga de Nginx
      ansible.builtin.debug:
        msg: "Nginx recargado exitosamente en {{ inventory_hostname }}"
      when: nginx_reloaded is succeeded

    # ------------------------------------------------------------------------
    # PASO 7: Verificación - Verificar que Nginx Esté Ejecutándose
    # ------------------------------------------------------------------------
    - name: Verificar que el servicio Nginx esté ejecutándose
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      tags: validate

    - name: Mostrar estado final de Nginx
      ansible.builtin.debug:
        msg: "Estado del servicio Nginx: {{ nginx_status.stdout }}"
      when: nginx_status is succeeded

    # Mostrar el contenido del archivo de índice personalizado para verificación
    - name: Verificar que el archivo de índice fue creado con el contenido correcto
      ansible.builtin.stat:
        path: "{{ nginx_root }}/{{ index_file }}"
      register: index_stat
      tags: validate

    - name: Mostrar verificación del archivo de índice
      ansible.builtin.debug:
        msg: "Archivo de índice existe en {{ nginx_root }}/{{ index_file }}"
      when: index_stat.stat.exists
