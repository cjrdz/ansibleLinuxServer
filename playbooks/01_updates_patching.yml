---
# ============================================================================
# SYSTEM UPDATES AND PATCH MANAGEMENT
# ============================================================================

- name: Update and Patch Ubuntu Servers
  hosts: ubuntu_servers
  become: true

  tasks:
    # ------------------------------------------------------------------------
    # STEP 1: Update Package Cache
    # ------------------------------------------------------------------------
    # Equivalent to running: apt update
    # Fetches the latest package index from Ubuntu repositories
    # cache_valid_time: Only update if cache is older than 1 hour
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600 # 3600 seconds = 1 hour
      register: cache_update

    # Display confirmation message when cache update succeeds
    - name: Display cache update result
      ansible.builtin.debug:
        msg: "Package cache updated on {{ inventory_hostname }}"
      when: cache_update is succeeded

    # ------------------------------------------------------------------------
    # STEP 2: Upgrade All Packages
    # ------------------------------------------------------------------------
    # Equivalent to running: apt dist-upgrade -y
    # Applies all available security and stability updates
    # upgrade: dist = Smart dependency handling (similar to full-upgrade)
    # autoremove: true = Removes packages that are no longer needed
    # autoclean: true = Removes old package files from cache
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    # Display confirmation message when upgrade succeeds
    - name: Display upgrade results
      ansible.builtin.debug:
        msg: "Packages upgraded on {{ inventory_hostname }}"
      when: upgrade_result is succeeded

    # ------------------------------------------------------------------------
    # STEP 3: Check for Reboot Requirement (Detective Control)
    # ------------------------------------------------------------------------
    # Ubuntu creates /var/run/reboot-required when kernel or critical
    # system packages are updated and require a reboot to take effect
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Alert administrators if reboot is needed
    # This is a detective control for audit and planning purposes
    - name: Display reboot notification
      ansible.builtin.debug:
        msg: "REBOOT REQUIRED on {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    # ------------------------------------------------------------------------
    # STEP 4: Identify Services Requiring Restart (Detective Control)
    # ------------------------------------------------------------------------
    # needrestart tool identifies services that need restart after updates
    # -b flag = batch mode (non-interactive output)
    # This helps identify services using outdated libraries
    - name: Get list of services that need restart
      ansible.builtin.command:
        cmd: needrestart -b
      register: needrestart_output
      failed_when: false # Don't fail if needrestart is not installed
      changed_when: false # This is a read-only check

    # Display services that should be restarted to apply updates
    - name: Show services needing restart
      ansible.builtin.debug:
        var: needrestart_output.stdout_lines
      when: needrestart_output.rc == 0
