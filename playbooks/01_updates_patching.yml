---
# ============================================================================
# ACTUALIZACIONES DEL SISTEMA Y GESTIÓN DE PARCHES
# ============================================================================

- name: Actualizar y Aplicar Parches en Servidores Ubuntu
  hosts: ubuntu_servers
  become: true

  tasks:
    # ------------------------------------------------------------------------
    # PASO 1: Actualizar Caché de Paquetes
    # ------------------------------------------------------------------------
    # Equivalente a ejecutar: apt update
    # Obtiene el índice de paquetes más reciente de los repositorios de Ubuntu
    # cache_valid_time: Solo actualiza si la caché es más antigua de 1 hora
    - name: Actualizar caché de paquetes apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600 # 3600 segundos = 1 hora
      register: cache_update

    # Mostrar mensaje de confirmación cuando la actualización de caché tenga éxito
    - name: Mostrar resultado de actualización de caché
      ansible.builtin.debug:
        msg: "Caché de paquetes actualizada en {{ inventory_hostname }}"
      when: cache_update is succeeded

    # ------------------------------------------------------------------------
    # PASO 2: Actualizar Todos los Paquetes
    # ------------------------------------------------------------------------
    # Equivalente a ejecutar: apt dist-upgrade -y
    # Aplica todas las actualizaciones de seguridad y estabilidad disponibles
    # upgrade: dist = Manejo inteligente de dependencias (similar a full-upgrade)
    # autoremove: true = Elimina paquetes que ya no son necesarios
    # autoclean: true = Elimina archivos antiguos de paquetes de la caché
    - name: Actualizar todos los paquetes
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    # Mostrar mensaje de confirmación cuando la actualización tenga éxito
    - name: Mostrar resultados de actualización
      ansible.builtin.debug:
        msg: "Paquetes actualizados en {{ inventory_hostname }}"
      when: upgrade_result is succeeded

    # ------------------------------------------------------------------------
    # PASO 3: Verificar Requisito de Reinicio (Control Detective)
    # ------------------------------------------------------------------------
    # Ubuntu crea /var/run/reboot-required cuando el kernel o paquetes críticos
    # del sistema se actualizan y requieren un reinicio para surtir efecto
    - name: Verificar si se requiere reinicio
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Alertar a los administradores si se necesita reinicio
    # Este es un control detective para auditoría y planificación
    - name: Mostrar notificación de reinicio
      ansible.builtin.debug:
        msg: "REINICIO REQUERIDO en {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    # ------------------------------------------------------------------------
    # PASO 4: Reiniciar Servidor si es Requerido (Control Correctivo)
    # ------------------------------------------------------------------------
    # Reinicia automáticamente el servidor cuando el kernel o paquetes críticos
    # del sistema han sido actualizados y requieren un reinicio para surtir efecto
    # reboot_timeout: Tiempo máximo de espera para que el servidor vuelva a estar en línea (por defecto: 600 segundos)
    # pre_reboot_delay: Tiempo de espera antes de iniciar el reinicio (por defecto: 0 segundos)
    # post_reboot_delay: Tiempo de espera después del reinicio antes de continuar (por defecto: 0 segundos)
    # test_command: Comando para verificar que el sistema está listo después del reinicio
    - name: Reiniciar servidor si es requerido
      ansible.builtin.reboot:
        reboot_timeout: 600  # Esperar hasta 10 minutos para que el servidor vuelva a estar en línea
        pre_reboot_delay: 5  # Esperar 5 segundos antes de iniciar el reinicio
        post_reboot_delay: 30  # Esperar 30 segundos después del reinicio antes de continuar
        test_command: uptime
      when: reboot_required.stat.exists

    # ------------------------------------------------------------------------
    # PASO 5: Identificar Servicios que Requieren Reinicio (Control Detective)
    # ------------------------------------------------------------------------
    # La herramienta needrestart identifica servicios que necesitan reinicio después de actualizaciones
    # -b flag = modo batch (salida no interactiva)
    # Esto ayuda a identificar servicios que usan bibliotecas desactualizadas
    - name: Obtener lista de servicios que necesitan reinicio
      ansible.builtin.command:
        cmd: needrestart -b
      register: needrestart_output
      failed_when: false # No fallar si needrestart no está instalado
      changed_when: false # Esta es una verificación de solo lectura

    # Mostrar servicios que deberían reiniciarse para aplicar actualizaciones
    - name: Mostrar servicios que necesitan reinicio
      ansible.builtin.debug:
        var: needrestart_output.stdout_lines
      when: needrestart_output.rc == 0
