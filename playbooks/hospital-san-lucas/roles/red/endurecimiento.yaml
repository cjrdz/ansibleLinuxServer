- name: Endurecimiento de la red
  hosts: todos_los_servidores
  become: yes
  tasks:
    - name: Aplicar parámetros de seguridad
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        # Prevenir ataques de IP Spoofing
        - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { key: 'net.ipv4.conf.default.rp_filter', value: '1' }
        
        # Ignorar redirecciones ICMP (Prevenir ataques Man-in-the-Middle)
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.conf.all.send_redirects', value: '0' }
        
        # Protección contra ataques de SYN Flood (DoS)
        - { key: 'net.ipv4.tcp_syncookies', value: '1' }
        - { key: 'net.ipv4.tcp_max_syn_backlog', value: '2048' }
        - { key: 'net.ipv4.tcp_synack_retries', value: '2' }
        
        # Ignorar respuestas de broadcast ICMP (Prevenir Smurf attacks)
        - { key: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        
        # Deshabilitar IPv6 si no es requerido (Reduce superficie de ataque)
        - { key: 'net.ipv6.conf.all.disable_ipv6', value: '1' }
