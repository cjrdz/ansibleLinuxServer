Temporizador para AIDE
  hosts: servidores_clinicos
  become: yes
  tasks:
    - name: Crear archivo de servicio para AIDE
      copy:
        dest: /etc/systemd/system/aide-check.service
        content: |
          [Unit]
          Description=Chequeo Diario de Integridad de Archivos
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/aide --check
          # Limitar impacto en el rendimiento
          CPUWeight=20
          IOWeight=20

    - name: Crear archivo de temporizador para AIDE
      copy:
        dest: /etc/systemd/system/aide-check.timer
        content: |
          [Unit]
          Description=Ejecutar AIDE todos los días a las cero horas
          [Timer]
          OnCalendar=*-*-* 00:00:00
          Persistent=true
          Unit=aide-check.service
          [Install]
          WantedBy=timers.target

    - name: Activar y arrancar el temporizador
      systemd:
        name: aide-check.timer
        enabled: yes
        state: started
        daemon_reload: yes
