- name: Monitoreo de máquinas virtuales
  hosts: hipervisores_san_lucas
  tasks:
    - name: Creación del servicio de auditoría
      copy:
        dest: /etc/systemd/system/kvm-audit.service
        content: |
          [Unit]
          Description=Auditoría de las máquinas virtuales
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/virsh list --all
          ExecStartPost=/usr/bin/virsh domstats
          # Reportar cualquier VM que no esté en modo seguro o con errores
          StandardOutput=append:/var/log/kvm-security-audit.log

    - name: Creación del temporizador
      copy:
        dest: /etc/systemd/system/kvm-audit.timer
        content: |
          [Unit]
          Description=Ejecución de la auditoría
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          [Install]
          WantedBy=timers.target

    - name: Activación del temporizador
      systemd:
        name: kvm-audit.timer
        state: started
        enabled: yes
        daemon_reload: yes
