---
# ============================================================================
# BASELINE DE HARDENING SSH (Acceso Solo con Claves)
# ============================================================================

- name: Aplicar Baseline de Hardening SSH (sshd_config)
  hosts: ubuntu_servers
  become: true # Requerido para modificar archivos del sistema y reiniciar servicios

  vars:
    # CRÍTICO: Definir grupos explícitamente permitidos para conectarse vía SSH
    # Asegurar que tu usuario de Ansible (ubuntu) sea miembro de uno de estos grupos
    allowed_ssh_groups: "ubuntu sudo"

    # Terminar sesiones inactivas después de 5 minutos (300 segundos)
    # Previene que sesiones desatendidas se conviertan en un riesgo de seguridad
    client_alive_timeout: 300

  tasks:
    # ------------------------------------------------------------------------
    # PASO 1: Asegurar que el Paquete del Servidor SSH Esté Instalado
    # ------------------------------------------------------------------------
    - name: Asegurar que el paquete del servidor SSH esté instalado
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
      tags: install

    # ------------------------------------------------------------------------
    # PASO 2: Forzar Protocolo SSH 2 (Moderno y Seguro)
    # ------------------------------------------------------------------------
    # El Protocolo 1 está deprecado y es vulnerable a ataques
    - name: Asegurar que se use el Protocolo SSH 2
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^Protocol"
        line: "Protocol 2"
        state: present
      notify: Restart sshd

    # ------------------------------------------------------------------------
    # PASO 3: Deshabilitar Inicio de Sesión Root
    # ------------------------------------------------------------------------
    # Previene ataques de fuerza bruta directos contra la cuenta root
    # El acceso root solo debe obtenerse a través de sudo después del inicio de sesión de usuario normal
    - name: Deshabilitar Inicio de Sesión Root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"
        state: present
      notify: Restart sshd

    # ------------------------------------------------------------------------
    # PASO 4: Deshabilitar Autenticación por Contraseña (Acceso Solo con Claves)
    # ------------------------------------------------------------------------
    # CRÍTICO: Esto fuerza solo autenticación basada en claves SSH
    # Elimina el riesgo de contraseñas débiles/comprometidas para acceso remoto
    # ADVERTENCIA: Asegurar que tengas claves SSH configuradas antes de aplicar esto
    - name: Deshabilitar Autenticación por Contraseña (Forzar Inicio de Sesión Solo con Claves)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: Restart sshd

    # ------------------------------------------------------------------------
    # PASO 5: Restringir Acceso SSH a Grupos Específicos
    # ------------------------------------------------------------------------
    # Solo usuarios en grupos definidos (ej., ubuntu, sudo) pueden conectarse vía SSH
    # Proporciona una capa adicional de control de acceso
    - name: Restringir Acceso SSH a Grupos Específicos
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^AllowGroups"
        line: "AllowGroups {{ allowed_ssh_groups }}"
        state: present
        insertafter: EOF
      notify: Restart sshd

    # ------------------------------------------------------------------------
    # PASO 6: Deshabilitar Reenvío X11
    # ------------------------------------------------------------------------
    # El reenvío X11 rara vez es necesario y puede ser un riesgo de seguridad
    # Deshabilitar a menos que sea específicamente requerido para tu caso de uso
    - name: Deshabilitar Reenvío X11
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^X11Forwarding"
        line: "X11Forwarding no"
        state: present
      notify: Restart sshd

    # ------------------------------------------------------------------------
    # PASO 7: Configurar Tiempo de Espera de Sesión Inactiva
    # ------------------------------------------------------------------------
    # ClientAliveInterval: El servidor envía mensaje keepalive cada N segundos
    # Si el cliente no responde, la conexión se considera inactiva
    - name: Establecer Tiempo de Espera de Cliente Inactivo (Timeout después de 5 minutos sin actividad)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^ClientAliveInterval"
        line: "ClientAliveInterval {{ client_alive_timeout }}"
        state: present
      notify: Restart sshd

    # ClientAliveCountMax: Número de mensajes keepalive antes de desconectar
    # Con interval=300 y count=3, la sesión termina después de 15 mins inactiva
    - name: Limitar ClientAliveCountMax a 3 verificaciones
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^ClientAliveCountMax"
        line: "ClientAliveCountMax 3"
        state: present
      notify: Restart sshd

  # --------------------------------------------------------------------------
  # HANDLERS: Solo Ejecutar Cuando Cambie la Configuración
  # --------------------------------------------------------------------------
  handlers:
    # Reiniciar demonio SSH para aplicar cambios de configuración
    # Solo se ejecuta si una de las tareas anteriores reporta un cambio
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
        enabled: true
