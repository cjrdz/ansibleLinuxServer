---
# ============================================================================
# HARDENING DE FIREWALL UFW (Universal - Todos los Entornos)
# ============================================================================

- name: Aplicar Hardening de Firewall UFW
  hosts: ubuntu_servers
  become: true
  vars:
    # Política por defecto: denegar todo el tráfico entrante a menos que se permita explícitamente
    default_policy_incoming: deny
    # Establecer en true solo para instancias de Oracle Cloud Infrastructure
    is_oracle_cloud: true

  tasks:
    # ------------------------------------------------------------------------
    # PASO 1: Instalación de Paquetes con Lógica de Reintento
    # ------------------------------------------------------------------------
    # Actualiza la caché de apt con mecanismo de reintento para manejar problemas temporales de red
    - name: Actualizar caché de apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600 # Caché válida por 1 hora
      register: apt_update
      retries: 5 # Reintentar hasta 5 veces
      delay: 10 # Esperar 10 segundos entre reintentos
      until: apt_update is success
      failed_when: false # No fallar el playbook si la actualización de caché falla

    # Instalar paquete de firewall UFW (requerido en todos los sistemas)
    - name: Instalar paquete UFW (si no está presente)
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: no # Usar lista de paquetes en caché de la tarea anterior

    # Instalar iptables-persistent solo en Oracle Cloud para persistencia de reglas
    - name: Instalar iptables-persistent (para compatibilidad con Oracle Cloud)
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: no
      when: is_oracle_cloud | bool

    # ------------------------------------------------------------------------
    # PASO 2: Específico de Oracle Cloud - Manejar Capa iptables Pre-existente
    # ------------------------------------------------------------------------
    # Las instancias de Oracle Cloud tienen una regla REJECT de iptables que bloquea el tráfico
    # antes de que UFW pueda procesarlo. Estas tareas insertan reglas ACCEPT antes de la
    # regla REJECT para asegurar que el tráfico HTTP/HTTPS llegue a la aplicación.

    # Verificar si la regla REJECT por defecto de Oracle existe en la cadena INPUT
    - name: Verificar si existe la regla REJECT de Oracle Cloud
      ansible.builtin.shell: |
        iptables -L INPUT -n --line-numbers | grep -E "REJECT.*icmp-host-prohibited"
      register: oracle_reject_rule
      failed_when: false
      changed_when: false
      when: is_oracle_cloud | bool

    # Insertar regla HTTP en la posición 5 (antes de la regla REJECT de Oracle en la línea 5)
    - name: Insertar regla HTTP ANTES de la regla REJECT de Oracle
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 80
        jump: ACCEPT
        action: insert
        rule_num: 5
      when:
        - is_oracle_cloud | bool
        - oracle_reject_rule.rc == 0

    # Insertar regla HTTPS en la posición 5 (empuja HTTP a la posición 6)
    - name: Insertar regla HTTPS ANTES de la regla REJECT de Oracle
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 443
        jump: ACCEPT
        action: insert
        rule_num: 5
      when:
        - is_oracle_cloud | bool
        - oracle_reject_rule.rc == 0

    # Persistir reglas de iptables a través de reinicios (solo Oracle Cloud)
    - name: Guardar reglas de iptables permanentemente (Oracle Cloud)
      ansible.builtin.shell: |
        iptables-save > /etc/iptables/rules.v4
      when:
        - is_oracle_cloud | bool
        - oracle_reject_rule.rc == 0

    # ------------------------------------------------------------------------
    # PASO 3: Configuración Universal de UFW (Todos los Entornos)
    # ------------------------------------------------------------------------
    # Establecer políticas por defecto: DENEGAR todo el tráfico entrante, PERMITIR todo el saliente
    # Esta es la base del modelo de seguridad "denegar-por-defecto"
    - name: Establecer política de firewall por defecto a DENEGAR entrante y PERMITIR saliente
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "{{ default_policy_incoming }}" }
        - { direction: "outgoing", policy: "allow" }

    # Permitir dinámicamente solo los puertos requeridos definidos en group_vars
    # Formato en group_vars: required_ports: ["22/tcp", "80/tcp", "443/tcp"]
    - name: Permitir puertos REQUERIDOS definidos en variables de grupo
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}" # Extraer número de puerto
        proto: "{{ item.split('/')[1] }}" # Extraer protocolo (tcp/udp)
      loop: "{{ required_ports }}"

    # Habilitar firewall UFW y asegurar que se inicie al arrancar
    - name: Habilitar UFW (si no está ya habilitado)
      community.general.ufw:
        state: enabled

    # ------------------------------------------------------------------------
    # PASO 4: Verificación y Auditoría (Controles Detectivos)
    # ------------------------------------------------------------------------
    # Mostrar estado de UFW para rastro de auditoría y verificación de cumplimiento
    - name: Reportar estado final de UFW
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Mostrar estado de UFW
      ansible.builtin.debug:
        var: ufw_status.stdout_lines

    # Mostrar cadena INPUT de iptables (solo Oracle Cloud) para verificar orden de reglas
    - name: Reportar cadena INPUT final de iptables (solo Oracle Cloud)
      ansible.builtin.command: iptables -L INPUT -n --line-numbers
      register: iptables_status
      changed_when: false
      when: is_oracle_cloud | bool

    - name: Mostrar cadena INPUT de iptables (solo Oracle Cloud)
      ansible.builtin.debug:
        var: iptables_status.stdout_lines
      when: is_oracle_cloud | bool
