---
# Variables comunes para todos los servidores Ubuntu

# Baseline de seguridad
security_baseline:
  ssh_port: 22
  allowed_ssh_users:
    - ubuntu
    - ansible_admin

# Reglas de firewall
firewall_rules:
  - { port: 22, proto: tcp, rule: allow, comment: "SSH" }
  - { port: 80, proto: tcp, rule: allow, comment: "HTTP" }
  - { port: 443, proto: tcp, rule: allow, comment: "HTTPS" }

# Puertos requeridos para UFW (formato: "puerto/protocolo")
required_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"

