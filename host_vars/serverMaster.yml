---
# Server Master Configuration
# Set these in your .env file:
#   ANSIBLE_HOST_MASTER=your.master.server.ip
#   ANSIBLE_SSH_KEY_PATH_MASTER=~/.ssh/your_key (or use ANSIBLE_SSH_KEY_PATH for all servers)

ansible_host: "{{ lookup('env', 'ANSIBLE_HOST_MASTER') | mandatory }}"
ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_KEY_PATH_MASTER') | default(lookup('env', 'ANSIBLE_SSH_KEY_PATH')) }}"

